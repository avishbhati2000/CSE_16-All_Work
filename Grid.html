<html>
    <head>
        <title>
            Grid
        </title>
        <style>
            .wrapper {
                display: grid;
                grid-template-columns:200px 200px 200px;
            }

            * {
                box-sizing: border-box
            }

            .wrapper {
                border: 2px red;
                border-radius: 5px;
               background-color: gray ;
            }

            .wrapper > div {
                border: 2px #ffa94d;
                border-radius: 5px;
                background-color: pink ;
                color:rgb(252, 15, 15);
            }

        </style>
    </head>
    <body>
        <div class="wrapper">
            <div>One</div>
            <div>Two</div>
            <div>Three</div>
            <div>Four</div>
            <div>Five</div>
        </div>
        
    </body>
</html>
